<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<title>Last-Space — Game</title>
		<link rel="stylesheet" href="debug/style.css">
	</head>
	<body class="game-page">
		<!-- ===== LOADING SCREEN (slideshow cinematic full-bleed + komposisi
		     LANDSCAPE: bottom bar horizontal — brand kiri, progress kanan.
		     Sama seperti game: full screen landscape, tidak ada kolom vertikal. ===== -->
		<div id="loading">
			<div class="loading-slides">
				<img class="slide active" src="assets/ui/loading/bg_01_nebula_fleet.jpg" alt="">
				<img class="slide" src="assets/ui/loading/bg_02_battle_station.jpg" alt="">
				<img class="slide" src="assets/ui/loading/bg_03_alien_fleet.jpg" alt="">
				<img class="slide" src="assets/ui/loading/bg_04_space_battle.jpg" alt="">
				<img class="slide" src="assets/ui/loading/bg_05_asteroid_planet.jpg" alt="">
			</div>
			<div class="loading-overlay"></div>
			<div class="loading-bottom">
				<div class="loading-brand">
					<img id="loading-icon" src="assets/ui/loading/icon_loading.png" alt="loading">
					<div class="loading-brand-text">
						<h1 class="loading-title">LAST-SPACE</h1>
						<p class="loading-text" id="loading-text">Memuat…</p>
					</div>
				</div>
				<div class="loading-progress">
					<span class="loading-pct" id="loading-pct">0%</span>
					<div class="loading-bar"><div class="loading-bar-fill"></div></div>
				</div>
			</div>
		</div>

		<!-- ===== GAME (full landscape adaptif — viewport = window, project.godot) ===== -->
		<div id="game-container">
			<canvas id="canvas"></canvas>
		</div>
		<a class="debug-link" href="debug.html">🔧 Debug</a>

		<script type="module">
			import {
				startSlideshow, hideLoading, setLoadingText, setProgress, showError,
			} from "./debug/loading.js";

			const BUILD = "web";
			startSlideshow();

			// --- cek build game ada ---
			setLoadingText("Memeriksa build game…");
			try {
				const res = await fetch(BUILD + "/game.pck", { method: "HEAD" });
				if (!res.ok) throw new Error("build tidak ditemukan");
			} catch (e) {
				showError("Build web/ belum ada — ini seharusnya tidak terjadi (build di-commit). Rebuild: bash tools/godot/run_game_check.sh all");
				throw e;
			}

			// --- load & start engine (Godot web build) ---
			setLoadingText("Memuat mesin game…");
			await import("./" + BUILD + "/godot.js"); // mendaftarkan window.Engine
			const canvas = document.getElementById("canvas");
			const engine = new window.Engine({
				executable: BUILD + "/game",
				mainPack: BUILD + "/game.pck",
				canvas: canvas,
				canvasResizePolicy: 2, // canvas isi window; viewport adaptif = window (project.godot viewport 0×0) → full screen
				focusCanvas: true,
				unloadAfterInit: true,
				onProgress: (current, total) => {
					if (total > 0) setProgress(Math.round((current / total) * 100));
				},
				onPrint: (...args) => {
					const line = args.join(" ");
					console.log(line);
					if (line.includes("QA:GAME:READY")) {
						setLoadingText("Siap! Selamat bermain 🚀");
						setProgress(100);
						setTimeout(hideLoading, 500);
					}
				},
				onPrintError: (...args) => console.error(...args),
			});
			engine.startGame().catch((e) => showError("Gagal memulai game: " + e.message));
		</script>
	</body>
</html>

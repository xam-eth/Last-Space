<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Last-Space — Godot Toolchain Smoke Test</title>
		<style>
			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
			}
			body {
				background-color: #05070f;
				overflow: hidden;
			}
			#canvas {
				display: block;
			}
			#hud {
				position: absolute;
				top: 8px;
				left: 8px;
				color: #7df9ff;
				font: 12px monospace;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<div id="hud">LAST-SPACE GODOT SMOKE TEST</div>
		<script type="module">
			// godot.js = Emscripten glue + Godot `Engine` shell class bundle.
			// Importing it registers `window.Engine` (see engine.js tail).
			import './godot.js';

			const canvas = document.getElementById('canvas');
			const engine = new window.Engine({
				executable: 'game',
				mainPack: 'game.pck',
				canvas: canvas,
				canvasResizePolicy: 2,
				focusCanvas: false,
				unloadAfterInit: true,
			});
			engine.startGame().catch(function (err) {
				console.error('GODOT_START_FAILED', err);
			});
		</script>
	</body>
</html>
